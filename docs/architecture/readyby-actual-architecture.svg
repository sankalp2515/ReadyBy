<text x="40" y="77" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#526073" text-anchor="start">Actual implementation • MCP connects household tools; AI interprets requests; checked schedules and consent govern changes.</text>
